<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOTHAN CRM — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#3a9900;--g2:#2d7700;--g3:#4cb800;
  --ga:rgba(58,153,0,.06);--gb:rgba(58,153,0,.15);--gc:rgba(58,153,0,.25);
  --wh:#ffffff;--wh2:#f7f8f5;--wh3:#f0f2ec;
  --tx:#0d0d0d;--tx2:#444;--tx3:#888;--tx4:#bbb;
  --bd:#e8ebe0;--bd2:#d4d8c8;
  --ff:'Bebas Neue',sans-serif;--fs:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--wh);font-family:var(--fs);color:var(--tx);display:flex;align-items:center;justify-content:center}

/* ── FONDO BLANCO CON DETALLES ── */
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(58,153,0,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(58,153,0,.04) 1px, transparent 1px);
  background-size:50px 50px;
}
.bg-glow{
  position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(100px);
}
.bg-glow1{width:600px;height:600px;background:radial-gradient(circle,rgba(58,153,0,.06),transparent 70%);top:-200px;right:-100px;animation:gFloat 14s ease-in-out infinite}
.bg-glow2{width:400px;height:400px;background:radial-gradient(circle,rgba(58,153,0,.05),transparent 70%);bottom:-150px;left:-100px;animation:gFloat 18s ease-in-out infinite reverse}
@keyframes gFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}

/* ── PARTÍCULAS ── */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;border-radius:50%;
  background:var(--g);opacity:0;
  animation:pFloat linear infinite;
}
@keyframes pFloat{
  0%{transform:translateY(100vh) translateX(0);opacity:0}
  10%{opacity:.15}
  90%{opacity:.05}
  100%{transform:translateY(-50px) translateX(var(--dx));opacity:0}
}

/* ── WRAP ── */
.wrap{
  position:relative;z-index:10;
  display:grid;grid-template-columns:1fr 1fr;
  width:860px;min-height:520px;
  border-radius:20px;overflow:hidden;
  box-shadow:0 20px 80px rgba(0,0,0,.08),0 4px 20px rgba(0,0,0,.05);
  border:1.5px solid var(--bd);
  animation:wrapIn .7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes wrapIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

/* ── PANEL IZQUIERDO — MARCA ── */
.panel-left{
  background:linear-gradient(160deg,#0a0a0a 0%,#111 50%,#0d1a06 100%);
  padding:52px 48px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.panel-left::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(58,153,0,.18),transparent 60%);
  pointer-events:none;
}
.pl-deco{
  position:absolute;bottom:-60px;right:-60px;
  width:220px;height:220px;border-radius:50%;
  border:1.5px solid rgba(58,153,0,.12);
  animation:decoSpin 20s linear infinite;
}
.pl-deco::before{
  content:'';position:absolute;inset:20px;border-radius:50%;
  border:1px solid rgba(58,153,0,.08);
}
@keyframes decoSpin{to{transform:rotate(360deg)}}
.pl-top{position:relative;z-index:2}
.pl-logo{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.pl-logo-ic{
  width:44px;height:44px;background:var(--g);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(58,153,0,.4);
  animation:icPulse 3s ease-in-out infinite;
}
@keyframes icPulse{0%,100%{box-shadow:0 4px 16px rgba(58,153,0,.4)}50%{box-shadow:0 4px 28px rgba(58,153,0,.7)}}
.pl-logo-name{font-family:var(--ff);font-size:26px;letter-spacing:4px;color:#fff;line-height:1}
.pl-logo-sub{font-size:9px;color:rgba(58,153,0,.8);letter-spacing:3px;text-transform:uppercase;margin-top:3px}
.pl-headline{font-family:var(--ff);font-size:44px;letter-spacing:2px;color:#fff;line-height:1.05;margin-bottom:16px}
.pl-headline span{color:var(--g)}
.pl-desc{font-size:13px;color:rgba(255,255,255,.4);line-height:1.7;max-width:240px}
.pl-bottom{position:relative;z-index:2}
.pl-stats{display:flex;gap:24px}
.pl-stat-n{font-family:var(--ff);font-size:28px;color:var(--g);letter-spacing:1px;line-height:1}
.pl-stat-l{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* ── PANEL DERECHO — FORM ── */
.panel-right{
  background:var(--wh);
  padding:52px 48px;
  display:flex;flex-direction:column;justify-content:center;
}
.form-title{font-family:var(--ff);font-size:30px;letter-spacing:2px;color:var(--tx);margin-bottom:6px}
.form-sub{font-size:13px;color:var(--tx3);margin-bottom:36px;line-height:1.5}
.form-sub strong{color:var(--g);font-weight:600}

/* INPUT */
.input-group{margin-bottom:18px}
.input-label{font-size:10px;font-weight:700;color:var(--g);letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:7px}
.input-wrap{position:relative}
.input-field{
  width:100%;background:var(--wh2);
  border:1.5px solid var(--bd);border-radius:8px;
  padding:12px 42px 12px 14px;
  color:var(--tx);font-family:var(--fs);font-size:13px;
  outline:none;transition:all .22s;
  caret-color:var(--g);
}
.input-field::placeholder{color:var(--tx4)}
.input-field:focus{
  border-color:var(--g);background:var(--wh);
  box-shadow:0 0 0 3px rgba(58,153,0,.08);
}
.input-icon{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:var(--tx4);transition:color .2s;pointer-events:none;
}
.input-field:focus~.input-icon{color:var(--g)}
.eye-btn{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--tx4);cursor:pointer;
  padding:4px;transition:color .2s;
}
.eye-btn:hover{color:var(--g)}

/* BTN */
.btn-login{
  width:100%;margin-top:4px;
  background:var(--g);color:var(--wh);border:none;
  padding:13px;border-radius:8px;
  font-family:var(--ff);font-size:18px;letter-spacing:3px;
  cursor:pointer;transition:all .22s;
  position:relative;overflow:hidden;
}
.btn-login::after{
  content:'';position:absolute;top:50%;left:50%;
  width:0;height:0;background:rgba(255,255,255,.15);
  border-radius:50%;transform:translate(-50%,-50%);
  transition:width .5s,height .5s;
}
.btn-login:hover::after{width:400px;height:400px}
.btn-login:hover{background:var(--g2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(58,153,0,.3)}
.btn-login:active{transform:translateY(0)}
.btn-login.loading{pointer-events:none}
.btn-login .btn-txt{transition:opacity .2s}
.btn-login.loading .btn-txt{opacity:0}
.btn-login .btn-spin{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:20px;height:20px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spinA .7s linear infinite;display:none;
}
.btn-login.loading .btn-spin{display:block}
@keyframes spinA{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ERROR */
.error-box{
  background:rgba(217,53,53,.06);border:1.5px solid rgba(217,53,53,.2);
  border-radius:8px;padding:10px 14px;margin-top:14px;
  font-size:12px;color:#c0392b;
  display:none;align-items:center;gap:8px;
  animation:shake .3s ease;
}
.error-box.show{display:flex}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* SUCCESS */
.success-overlay{
  position:fixed;inset:0;z-index:100;background:var(--wh);
  display:none;flex-direction:column;align-items:center;justify-content:center;
}
.success-overlay.show{display:flex;animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.s-icon{
  width:72px;height:72px;background:var(--g);border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  margin-bottom:20px;
  animation:sBounce .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.1s;
  box-shadow:0 8px 32px rgba(58,153,0,.3);
}
@keyframes sBounce{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.s-name{font-family:var(--ff);font-size:28px;letter-spacing:3px;color:var(--tx);animation:sUp .4s ease both;animation-delay:.3s}
.s-role{font-size:12px;color:var(--g);letter-spacing:2px;text-transform:uppercase;margin-top:6px;animation:sUp .4s ease both;animation-delay:.4s}
.s-bar{width:180px;height:3px;background:var(--bd);border-radius:2px;margin-top:28px;overflow:hidden;animation:sUp .4s ease both;animation-delay:.5s}
.s-fill{height:100%;background:var(--g);width:0;border-radius:2px;animation:sFill 1.4s ease both;animation-delay:.6s}
@keyframes sFill{from{width:0}to{width:100%}}
.s-txt{font-size:11px;color:var(--tx4);letter-spacing:2px;text-transform:uppercase;margin-top:10px;animation:sUp .4s ease both;animation-delay:.7s}
@keyframes sUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow1"></div>
<div class="bg-glow bg-glow2"></div>
<div class="particles" id="particles"></div>

<div class="wrap">

  <!-- IZQUIERDO -->
  <div class="panel-left">
    <div class="pl-deco"></div>
    <div class="pl-top">
      <div class="pl-logo">
        <div class="pl-logo-ic">🌿</div>
        <div>
          <div class="pl-logo-name">BIOTHAN</div>
          <div class="pl-logo-sub">CRM Panel</div>
        </div>
      </div>
      <div class="pl-headline">CONTROL<br>TOTAL DE<br><span>PEDIDOS</span></div>
      <div class="pl-desc">Gestiona tus pedidos de WooCommerce en tiempo real desde un solo panel.</div>
    </div>
    <div class="pl-bottom">
      <div class="pl-stats">
        <div>
          <div class="pl-stat-n" id="statPedidos">—</div>
          <div class="pl-stat-l">Pedidos</div>
        </div>
        <div>
          <div class="pl-stat-n" id="statIngresos">—</div>
          <div class="pl-stat-l">Ingresos</div>
        </div>
      </div>
    </div>
  </div>

  <!-- DERECHO -->
  <div class="panel-right">
    <div class="form-title">BIENVENIDO</div>
    <div class="form-sub">Ingresa tus credenciales para<br>acceder al <strong>Panel CRM</strong></div>

    <div class="input-group">
      <label class="input-label">Usuario</label>
      <div class="input-wrap">
        <input class="input-field" type="text" id="userInput"
          placeholder="Tu nombre de usuario"
          onkeydown="if(event.key==='Enter')document.getElementById('passInput').focus()">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label">Contraseña</label>
      <div class="input-wrap">
        <input class="input-field" type="password" id="passInput"
          placeholder="••••••••••"
          onkeydown="if(event.key==='Enter')intentarLogin()">
        <button class="eye-btn" onclick="togglePass()" type="button" tabindex="-1">
          <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="btnLogin" onclick="intentarLogin()">
      <span class="btn-txt">INGRESAR</span>
      <div class="btn-spin"></div>
    </button>

    <div class="error-box" id="errorBox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorTxt">Usuario o contraseña incorrectos</span>
    </div>
  </div>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="successOverlay">
  <div class="s-icon">🌿</div>
  <div class="s-name" id="sName">BIENVENIDO</div>
  <div class="s-role" id="sRole">Acceso autorizado</div>
  <div class="s-bar"><div class="s-fill"></div></div>
  <div class="s-txt">Cargando panel...</div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  USUARIOS — edita aquí las credenciales
// ══════════════════════════════════════════════════════
const USUARIOS = [
  { usuario:'yuri',        pass:'biothan2026',   nombre:'Yuri Biothan',   rol:'Administrador'   },
  { usuario:'ventas',      pass:'ventas2026',    nombre:'Ventas',         rol:'Agente de ventas'},
  { usuario:'logistica',   pass:'logistica2026', nombre:'Logística',      rol:'Operaciones'     },
  { usuario:'compras',     pass:'compras2026',   nombre:'Compras',        rol:'Compras'         },
  { usuario:'admin',       pass:'admin2026',     nombre:'Administración', rol:'Finanzas'        },
];

const CRM_URL   = 'index.html';
const SHEET_ID  = '1odSmdqiJehan8JqVOBVBpisT5s7hG50eYiJwmiNM3NQ';
const SHEET_NM  = 'PEDIDOS';

// ── Cargar stats del panel izquierdo ─────────────────
async function cargarStats(){
  try{
    const url  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NM)}&t=${Date.now()}`;
    const res  = await fetch(url);
    const txt  = await res.text();
    const json = JSON.parse(txt.replace(/^.*?({.*}).*?$/s,'$1'));
    const rows = (json.table.rows||[]).filter(r=>r.c&&r.c[0]&&r.c[0].v&&r.c[0].v!=='ID Pedido');
    let ing = 0;
    rows.forEach(r=>{
      const t = r.c&&r.c[11] ? String(r.c[11].f||r.c[11].v||'0') : '0';
      const n = parseFloat(t.replace(/[$,]/g,''));
      if(!isNaN(n)) ing+=n;
    });
    document.getElementById('statPedidos').textContent  = rows.length;
    document.getElementById('statIngresos').textContent = '$'+Math.round(ing).toLocaleString('es-MX');
  }catch(e){}
}

// ── Login ─────────────────────────────────────────────
function intentarLogin(){
  const usr  = document.getElementById('userInput').value.trim().toLowerCase();
  const pass = document.getElementById('passInput').value;
  if (!usr || !pass){ mostrarError('Completa todos los campos'); return; }

  const btn = document.getElementById('btnLogin');
  btn.classList.add('loading');
  ocultarError();

  setTimeout(()=>{
    const found = USUARIOS.find(u => u.usuario === usr && u.pass === pass);
    if(found){
      sessionStorage.setItem('crm_user', JSON.stringify({nombre:found.nombre, rol:found.rol}));
      document.getElementById('sName').textContent = found.nombre.toUpperCase();
      document.getElementById('sRole').textContent = found.rol;
      document.getElementById('successOverlay').classList.add('show');
      setTimeout(()=>{ window.location.href = CRM_URL; }, 2200);
    } else {
      btn.classList.remove('loading');
      mostrarError('Usuario o contraseña incorrectos');
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  }, 800);
}

function mostrarError(msg){
  const b = document.getElementById('errorBox');
  document.getElementById('errorTxt').textContent = msg;
  b.classList.add('show');
}
function ocultarError(){ document.getElementById('errorBox').classList.remove('show'); }

function togglePass(){
  const inp = document.getElementById('passInput');
  const ico = document.getElementById('eyeIcon');
  if(inp.type==='password'){
    inp.type='text';
    ico.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type='password';
    ico.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

// ── Partículas ────────────────────────────────────────
function crearParticulas(){
  const c = document.getElementById('particles');
  for(let i=0;i<25;i++){
    const p=document.createElement('div');
    p.className='particle';
    const s=Math.random()*3+1;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*18+10}s;animation-delay:${Math.random()*12}s;--dx:${(Math.random()-.5)*80}px`;
    c.appendChild(p);
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  crearParticulas();
  cargarStats();
  document.getElementById('userInput').addEventListener('input', ocultarError);
  document.getElementById('passInput').addEventListener('input', ocultarError);
});
</script>
</body>
</html>
